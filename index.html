<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sistema Financeiro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#17212b;--muted:#687786;--line:#e4e9ee;--green:#13795b;--green2:#e8f5ef;--red:#b54747;--nav:#152b28;--accent:#1e8a68}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 15px;background:var(--green);color:#fff;font-weight:650}button.secondary{background:#edf2f4;color:#263746}button.danger{background:#fff0f0;color:#a33}button:disabled{opacity:.5;cursor:not-allowed}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(140deg,#122b27,#1c7357)}.loginbox{background:#fff;border-radius:20px;padding:28px;width:min(420px,100%);box-shadow:0 18px 60px #0003}.loginbox h1{margin:0 0 6px}.loginbox p{color:var(--muted);margin-top:0}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.field label{font-size:13px;font-weight:650;color:#52616d}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);min-width:0}.field textarea{min-height:72px}.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.sidebar{background:var(--nav);color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:8px}.brand{font-size:18px;font-weight:800;padding:4px 10px 20px}.brand small{display:block;font-size:11px;color:#a9c4bb;font-weight:500;margin-top:3px}.navbtn{background:transparent;color:#d9e6e1;text-align:left;font-weight:550;padding:12px;border-radius:9px}.navbtn.active,.navbtn:hover{background:#ffffff1c;color:#fff}.sidebottom{margin-top:auto;color:#abc0b8;font-size:12px;padding:10px}.main{min-width:0;padding:24px;max-width:1500px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.top h1{font-size:25px;margin:0}.top p{margin:3px 0;color:var(--muted);font-size:13px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:0 2px 8px #152b2807}.metric span{font-size:12px;color:var(--muted)}.metric strong{display:block;font-size:23px;margin-top:7px}.metric em{font-size:12px;color:var(--muted);font-style:normal}.panel{margin-bottom:16px}.panel h2{font-size:17px;margin:0 0 14px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.sectionhead h2{margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:620px}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap}th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}td strong{font-weight:700}.pill{display:inline-block;border-radius:20px;padding:4px 8px;background:#edf3f1;color:#356052;font-size:11px}.pill.warn{background:#fff4df;color:#94631d}.pill.red{background:#fff0f0;color:#a33}.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 12px}.formgrid .wide{grid-column:1/-1}.formactions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.notice{padding:11px 13px;border-radius:9px;background:#edf5f2;color:#315d4e;font-size:13px;margin:10px 0}.error{background:#fff0f0;color:#a33}.empty{text-align:center;color:var(--muted);padding:25px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:13px}.toolbar input,.toolbar select{padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff}.small{font-size:12px;color:var(--muted)}.inlinecheck{display:flex;gap:8px;align-items:center;margin:12px 0}.inlinecheck input{width:auto}.menu-toggle{display:none;background:#214d40}.footer{color:var(--muted);font-size:11px;text-align:right;padding:10px}
@media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{padding:10px;position:sticky;top:0;z-index:5;flex-direction:row;overflow:auto;align-items:center}.brand{display:none}.navbtn{white-space:nowrap;padding:10px}.sidebottom{display:none}.main{padding:16px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:540px){.main{padding:12px}.cards{gap:8px}.card,.panel{padding:13px}.metric strong{font-size:19px}.top h1{font-size:21px}.formgrid,.row{grid-template-columns:1fr}.formgrid .wide{grid-column:auto}.top{align-items:flex-start}.top button{padding:9px}}
</style>
</head>
<body>
<div id="login" class="login"><div class="loginbox"><h1>Financeiro</h1><p>Compras, vendas, pesagens e adiantamentos em um só lugar.</p><div id="authmsg" class="notice hidden"></div><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="username" placeholder="seu@email.com"></div><div class="field"><label>Senha</label><input id="password" type="password" autocomplete="current-password" placeholder="Sua senha"></div><button id="signin" style="width:100%">Entrar</button><button id="signup" class="secondary" style="width:100%;margin-top:8px">Criar primeiro acesso</button><p class="small" style="margin-top:15px">Os dados ficam online e o acesso é liberado somente para e-mails autorizados pela administração.</p></div></div>
<div id="app" class="shell hidden"><aside class="sidebar"><div class="brand">FINANCEIRO<small id="companySide">Gestão da empresa</small></div><button class="navbtn active" data-page="dashboard">▦ Visão geral</button><button class="navbtn" data-page="pesagens">⚖ Compras e vendas</button><button class="navbtn" data-page="adiantamentos">↗ Adiantamentos</button><button class="navbtn" data-page="pessoas">♙ Pessoas</button><button class="navbtn" data-page="materiais">▤ Materiais e preços</button><button class="navbtn" data-page="fechamentos">▣ Fechamento financeiro</button><button class="navbtn" data-page="config">⚙ Configurações</button><div class="sidebottom">Sincronização online ativa<br><span id="useremail"></span><br><button id="logout" class="secondary" style="margin-top:10px;width:100%">Sair</button></div></aside><main class="main"><header class="top"><div><h1 id="pageTitle">Visão geral</h1><p id="today"></p></div><button id="quickNew">+ Nova pesagem</button></header><div id="content"></div><div class="footer">Sistema Financeiro · dados sincronizados online</div></main></div>
<script>
const SUPABASE_URL='https://gpsfzberyhtkaoipcjuc.supabase.co';
const SUPABASE_KEY='sb_publishable_3KlgLuubg78qwQMBSC7AbA_UKL_U2y8';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let user=null,page='dashboard',people=[],materials=[],weighings=[],advances=[],closures=[];
const $=id=>document.getElementById(id);const money=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const num=v=>Number(v||0);const dateNow=()=>new Date().toLocaleDateString('en-CA');const fmtDate=v=>v?new Date(v+'T12:00:00').toLocaleDateString('pt-BR'):'—';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msg(el,text,error=false){el.textContent=text;el.classList.remove('hidden','error');if(error)el.classList.add('error')}
$('signin').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)msg($('authmsg'),error.message,true)};
$('signup').onclick=async()=>{const {data,error}=await db.auth.signUp({email:$('email').value,password:$('password').value});if(error)msg($('authmsg'),error.message,true);else msg($('authmsg'),data.session?'Acesso criado. Entrando…':'Cadastro enviado. Se a confirmação por e-mail estiver ativa, confirme o endereço antes de entrar.')};
$('logout').onclick=()=>db.auth.signOut();db.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;if(user){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('useremail').textContent=user.email;loadAll()}else{$('app').classList.add('hidden');$('login').classList.remove('hidden')}});
$('today').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>showPage(b.dataset.page));$('quickNew').onclick=()=>showPage('pesagens',true);
function showPage(p,form=false){page=p;document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('pageTitle').textContent=({dashboard:'Visão geral',pesagens:'Compras e vendas',adiantamentos:'Adiantamentos',pessoas:'Pessoas',materiais:'Materiais e preços',fechamentos:'Fechamento financeiro',config:'Configurações'})[p];render(form)}
async function loadAll(){try{const access=await db.from('financeiro_usuarios_autorizados').select('email').eq('email',user.email).maybeSingle();if(access.error)throw access.error;if(!access.data){$('content').innerHTML='<div class="panel"><h2>Acesso ainda não autorizado</h2><p>Seu e-mail foi autenticado, mas ainda não foi liberado para consultar os dados desta empresa. Peça ao administrador para autorizar este endereço de e-mail.</p><button id="accessLogout" class="secondary">Sair</button></div>';$('accessLogout').onclick=()=>db.auth.signOut();return}const [a,b,c,d,e,f]=await Promise.all([db.from('financeiro_config').select('*').eq('id',true).maybeSingle(),db.from('financeiro_pessoas').select('*').order('nome'),db.from('financeiro_materiais').select('*').order('nome'),db.from('financeiro_pesagens').select('*,financeiro_pessoas(nome),financeiro_materiais(nome)').order('data',{ascending:false}).order('numero_ticket',{ascending:false}).limit(1000),db.from('financeiro_adiantamentos').select('*,financeiro_pessoas(nome)').order('data',{ascending:false}),db.from('financeiro_fechamentos').select('*').order('fechado_em',{ascending:false})]);for(const x of [a,b,c,d,e,f])if(x.error)throw x.error;people=b.data||[];materials=c.data||[];weighings=d.data||[];advances=e.data||[];closures=f.data||[];$('companySide').textContent=a.data?.nome_empresa||'Gestão da empresa';render()}catch(e){$('content').innerHTML=`<div class="notice error">Não foi possível carregar os dados: ${esc(e.message)}</div>`}}
function render(openForm=false){if(!user)return;const root=$('content');if(page==='dashboard')root.innerHTML=dashboard();if(page==='pesagens')root.innerHTML=pesagensPage(openForm);if(page==='adiantamentos')root.innerHTML=advancesPage();if(page==='pessoas')root.innerHTML=peoplePage();if(page==='materiais')root.innerHTML=materialsPage();if(page==='fechamentos')root.innerHTML=closuresPage();if(page==='config')root.innerHTML=configPage();bindPage()}
function dashboard(){const buy=weighings.filter(x=>x.tipo==='compra').reduce((s,x)=>s+num(x.valor_liquido),0),sell=weighings.filter(x=>x.tipo==='venda').reduce((s,x)=>s+num(x.valor_liquido),0),disc=weighings.reduce((s,x)=>s+num(x.desconto_pesagem)+num(x.desconto_adiantamento),0),open=advances.reduce((s,x)=>s+num(x.saldo),0);return `<div class="cards"><div class="card metric"><span>Compras líquidas</span><strong>${money(buy)}</strong><em>Registros cadastrados</em></div><div class="card metric"><span>Vendas líquidas</span><strong>${money(sell)}</strong><em>Registros cadastrados</em></div><div class="card metric"><span>Descontos aplicados</span><strong>${money(disc)}</strong><em>Pesagem + adiantamento</em></div><div class="card metric"><span>Adiantamentos em aberto</span><strong>${money(open)}</strong><em>Saldo a descontar</em></div></div><div class="panel"><div class="sectionhead"><h2>Movimentações recentes</h2><button class="secondary" data-go="pesagens">Ver todas</button></div>${weighings.length?tableWeighings(weighings.slice(0,8)):'<div class="empty">Nenhuma pesagem cadastrada.</div>'}</div><div class="row"><div class="panel"><h2>Resumo de compras</h2><strong style="font-size:23px">${money(buy)}</strong><p class="small">Total líquido registrado</p></div><div class="panel"><h2>Resumo de vendas</h2><strong style="font-size:23px">${money(sell)}</strong><p class="small">Total líquido registrado</p></div></div>`}
function tableWeighings(rows){return `<div class="tablewrap"><table><thead><tr><th>Ticket</th><th>Data</th><th>Tipo</th><th>Pessoa</th><th>Material</th><th>Peso líquido</th><th>Valor líquido</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td>#${x.numero_ticket}</td><td>${fmtDate(x.data)}</td><td><span class="pill">${x.tipo}</span></td><td>${esc(x.financeiro_pessoas?.nome||'')}</td><td>${esc(x.descricao_material||x.financeiro_materiais?.nome||'—')}</td><td>${num(x.peso_liquido).toLocaleString('pt-BR')} kg</td><td><strong>${money(x.valor_liquido)}</strong></td><td><span class="pill ${x.status==='pendente'?'warn':''}">${x.status}</span></td><td><button class="danger" data-delete-weigh="${x.id}" style="padding:6px 9px">Excluir</button></td></tr>`).join('')}</tbody></table></div>`}
function pesagensPage(open){return `${open?weighForm():''}<div class="panel"><div class="sectionhead"><h2>Histórico de compras e vendas</h2><button data-action="newweigh">+ Nova pesagem</button></div><div class="toolbar"><select id="filterType"><option value="">Todos os tipos</option><option value="compra">Compras</option><option value="venda">Vendas</option></select><input id="filterText" placeholder="Buscar pessoa ou material"><input id="filterDate" type="date"></div><div id="weighTable">${weighings.length?tableWeighings(weighings):'<div class="empty">Nenhum lançamento cadastrado.</div>'}</div></div>`}
function weighForm(){return `<div class="panel" id="weighForm"><h2>Registrar pesagem</h2><form id="formWeigh"><div class="formgrid"><div class="field"><label>Tipo</label><select id="wType"><option value="compra">Compra</option><option value="venda">Venda</option></select></div><div class="field"><label>Data</label><input id="wDate" type="date" value="${dateNow()}" required></div><div class="field"><label>Pessoa (fornecedor/cliente)</label><select id="wPerson" required><option value="">Selecione</option>${people.filter(p=>p.ativo).map(p=>`<option value="${p.id}">${esc(p.nome)}</option>`).join('')}</select></div><div class="field"><label>Material</label><select id="wMaterial"><option value="">Outro / não cadastrado</option>${materials.filter(m=>m.ativo).map(m=>`<option value="${m.id}">${esc(m.nome)}</option>`).join('')}</select></div><div class="field"><label>Descrição do material</label><input id="wDesc" placeholder="Ex.: papelão, ferro, PET"></div><div class="field"><label>Peso de entrada (kg)</label><input id="wGross" type="number" min="0" step="0.001" value="0"></div><div class="field"><label>Tara (kg)</label><input id="wTare" type="number" min="0" step="0.001" value="0"></div><div class="field"><label>Desconto na pesagem (kg)</label><input id="wWeightDisc" type="number" min="0" step="0.001" value="0"></div><div class="field"><label>Preço por kg (R$)</label><input id="wPrice" type="number" min="0" step="0.0001" value="0"></div><div class="field"><label>Desconto adicional (R$)</label><input id="wMoneyDisc" type="number" min="0" step="0.01" value="0"></div><div class="field" id="advanceField"><label>Descontar adiantamento</label><select id="wAdvance"><option value="">Não descontar</option></select></div><div class="field"><label>Valor a descontar do adiantamento (R$)</label><input id="wAdvanceValue" type="number" min="0" step="0.01" value="0"></div><div class="field wide"><label>Observações</label><textarea id="wNotes" placeholder="Informações adicionais"></textarea></div></div><div class="notice" id="wCalc">Peso líquido: 0 kg · Total líquido: R$ 0,00</div><div class="formactions"><button type="button" class="secondary" data-action="cancelweigh">Cancelar</button><button type="submit">Salvar pesagem</button></div></form></div>`}
function advancesPage(){return `<div class="panel"><h2>Registrar adiantamento</h2><form id="formAdvance"><div class="formgrid"><div class="field"><label>Fornecedor</label><select id="aPerson" required><option value="">Selecione</option>${people.map(p=>`<option value="${p.id}">${esc(p.nome)}</option>`).join('')}</select></div><div class="field"><label>Data</label><input id="aDate" type="date" value="${dateNow()}" required></div><div class="field"><label>Valor (R$)</label><input id="aValue" type="number" min="0.01" step="0.01" required></div><div class="field wide"><label>Observações</label><input id="aNotes"></div></div><div class="formactions"><button type="submit">Salvar adiantamento</button></div></form></div><div class="panel"><h2>Histórico e saldo dos adiantamentos</h2>${advances.length?`<div class="tablewrap"><table><thead><tr><th>Data</th><th>Fornecedor</th><th>Valor inicial</th><th>Saldo restante</th><th>Observações</th></tr></thead><tbody>${advances.map(a=>`<tr><td>${fmtDate(a.data)}</td><td>${esc(a.financeiro_pessoas?.nome)}</td><td>${money(a.valor)}</td><td><strong>${money(a.saldo)}</strong></td><td>${esc(a.observacoes||'—')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhum adiantamento registrado.</div>'}</div>`}
function peoplePage(){return `<div class="panel"><h2>Cadastrar pessoa</h2><form id="formPerson"><div class="formgrid"><div class="field"><label>Nome</label><input id="pName" required></div><div class="field"><label>Tipo</label><select id="pType"><option value="ambos">Fornecedor e cliente</option><option value="fornecedor">Fornecedor</option><option value="cliente">Cliente</option></select></div><div class="field"><label>CPF/CNPJ</label><input id="pDoc"></div><div class="field"><label>Telefone</label><input id="pPhone"></div><div class="field wide"><label>Observações</label><input id="pNotes"></div></div><div class="formactions"><button type="submit">Cadastrar pessoa</button></div></form></div><div class="panel"><h2>Pessoas cadastradas</h2>${people.length?`<div class="tablewrap"><table><thead><tr><th>Nome</th><th>Tipo</th><th>Documento</th><th>Telefone</th><th>Status</th></tr></thead><tbody>${people.map(p=>`<tr><td>${esc(p.nome)}</td><td>${p.tipo}</td><td>${esc(p.documento||'—')}</td><td>${esc(p.telefone||'—')}</td><td>${p.ativo?'Ativo':'Inativo'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Cadastre fornecedores e clientes para começar.</div>'}</div>`}
function materialsPage(){return `<div class="panel"><h2>Cadastrar material e preços</h2><form id="formMaterial"><div class="formgrid"><div class="field"><label>Material</label><input id="mName" required></div><div class="field"><label>Preço de compra por kg (R$)</label><input id="mBuy" type="number" min="0" step="0.0001" value="0"></div><div class="field"><label>Preço de venda por kg (R$)</label><input id="mSell" type="number" min="0" step="0.0001" value="0"></div></div><div class="formactions"><button type="submit">Salvar material</button></div></form></div><div class="panel"><h2>Tabela de materiais</h2>${materials.length?`<div class="tablewrap"><table><thead><tr><th>Material</th><th>Compra/kg</th><th>Venda/kg</th><th>Status</th></tr></thead><tbody>${materials.map(m=>`<tr><td>${esc(m.nome)}</td><td>${money(m.preco_compra)}</td><td>${money(m.preco_venda)}</td><td>${m.ativo?'Ativo':'Inativo'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhum material cadastrado.</div>'}</div>`}
function closuresPage(){return `<div class="panel"><h2>Gerar fechamento financeiro</h2><form id="formClose"><div class="row"><div class="field"><label>Data inicial</label><input id="cStart" type="date" value="${dateNow()}" required></div><div class="field"><label>Data final</label><input id="cEnd" type="date" value="${dateNow()}" required></div></div><div class="field"><label>Observações</label><textarea id="cNotes"></textarea></div><div class="formactions"><button type="submit">Calcular e salvar fechamento</button></div></form><p class="small">O fechamento salva um retrato do período e vincula as pesagens ainda não fechadas, evitando duplicidade em fechamentos seguintes.</p></div><div class="panel"><h2>Fechamentos salvos</h2>${closures.length?`<div class="tablewrap"><table><thead><tr><th>Período</th><th>Compras</th><th>Vendas</th><th>Descontos</th><th>Saldo do período</th><th>Fechado em</th></tr></thead><tbody>${closures.map(c=>`<tr><td>${fmtDate(c.data_inicio)} a ${fmtDate(c.data_fim)}</td><td>${money(c.compras)}</td><td>${money(c.vendas)}</td><td>${money(num(c.descontos_pesagem)+num(c.descontos_adiantamento))}</td><td><strong>${money(c.saldo_periodo)}</strong></td><td>${new Date(c.fechado_em).toLocaleString('pt-BR')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhum fechamento salvo.</div>'}</div>`}
function configPage(){return `<div class="panel"><h2>Dados da empresa</h2><form id="formConfig"><div class="field"><label>Nome da empresa</label><input id="companyName" value="${esc($('companySide').textContent==='Gestão da empresa'?'Minha empresa':$('companySide').textContent)}" required></div><div class="formactions"><button type="submit">Salvar configurações</button></div></form></div><div class="panel"><h2>Sobre os dados</h2><p class="small">Os registros ficam no banco online exclusivo deste sistema. O acesso é protegido por e-mail e senha. Todos os usuários autenticados neste projeto compartilham os mesmos dados da empresa.</p></div>`}
function bindPage(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>showPage(b.dataset.go));document.querySelectorAll('[data-action="newweigh"]').forEach(b=>b.onclick=()=>{render(true);$('weighForm')?.scrollIntoView({behavior:'smooth'})});document.querySelectorAll('[data-action="cancelweigh"]').forEach(b=>b.onclick=()=>render(false));document.querySelectorAll('[data-delete-weigh]').forEach(b=>b.onclick=async()=>{if(!confirm('Excluir esta pesagem? Se houver desconto de adiantamento, ele será devolvido ao saldo.'))return;const {error}=await db.from('financeiro_pesagens').delete().eq('id',b.dataset.deleteWeigh);if(error)alert(error.message);else loadAll()});
const wt=$('wType');if(wt){const update=()=>{const gross=num($('wGross').value),tare=num($('wTare').value),wd=num($('wWeightDisc').value),price=num($('wPrice').value),md=num($('wMoneyDisc').value),ad=num($('wAdvanceValue').value),net=Math.max(0,gross-tare-wd),br=net*price,li=Math.max(0,br-md-ad);$('wCalc').textContent=`Peso líquido: ${net.toLocaleString('pt-BR')} kg · Total bruto: ${money(br)} · Total líquido: ${money(li)}`;};['wGross','wTare','wWeightDisc','wPrice','wMoneyDisc','wAdvanceValue'].forEach(id=>$(id).oninput=update);$('wMaterial').onchange=()=>{const m=materials.find(x=>x.id===$('wMaterial').value);if(m){$('wDesc').value=m.nome;$('wPrice').value=wt.value==='compra'?m.preco_compra:m.preco_venda;update()}};wt.onchange=()=>{const m=materials.find(x=>x.id===$('wMaterial').value);if(m)$('wPrice').value=wt.value==='compra'?m.preco_compra:m.preco_venda;$('advanceField').classList.toggle('hidden',wt.value!=='compra');update()};$('wPerson').onchange=()=>fillAdvances();$('formWeigh').onsubmit=saveWeigh;fillAdvances();update();}
if($('filterType')){const filter=()=>{let rows=weighings;const t=$('filterType').value,q=$('filterText').value.toLowerCase(),d=$('filterDate').value;if(t)rows=rows.filter(x=>x.tipo===t);if(d)rows=rows.filter(x=>x.data===d);if(q)rows=rows.filter(x=>(x.financeiro_pessoas?.nome||'').toLowerCase().includes(q)||(x.descricao_material||x.financeiro_materiais?.nome||'').toLowerCase().includes(q));$('weighTable').innerHTML=rows.length?tableWeighings(rows):'<div class="empty">Nenhum resultado.</div>';document.querySelectorAll('[data-delete-weigh]').forEach(b=>b.onclick=async()=>{if(confirm('Excluir pesagem?')){const {error}=await db.from('financeiro_pesagens').delete().eq('id',b.dataset.deleteWeigh);if(error)alert(error.message);else loadAll()}})};$('filterType').onchange=filter;$('filterText').oninput=filter;$('filterDate').onchange=filter}
if($('formAdvance'))$('formAdvance').onsubmit=saveAdvance;if($('formPerson'))$('formPerson').onsubmit=savePerson;if($('formMaterial'))$('formMaterial').onsubmit=saveMaterial;if($('formClose'))$('formClose').onsubmit=saveClose;if($('formConfig'))$('formConfig').onsubmit=saveConfig;
}
function fillAdvances(){if(!$('wAdvance'))return;const pid=$('wPerson').value;const list=advances.filter(a=>a.pessoa_id===pid&&num(a.saldo)>0);$('wAdvance').innerHTML='<option value="">Não descontar</option>'+list.map(a=>`<option value="${a.id}">${fmtDate(a.data)} · saldo ${money(a.saldo)}</option>`).join('');$('wAdvance').onchange=()=>{const a=list.find(x=>x.id===$('wAdvance').value);$('wAdvanceValue').value=a?Math.min(num(a.saldo),Math.max(0,num($('wGross').value)-num($('wTare').value)-num($('wWeightDisc').value))*num($('wPrice').value)):0;$('wAdvanceValue').dispatchEvent(new Event('input'))}}
async function saveWeigh(ev){ev.preventDefault();const gross=num($('wGross').value),tare=num($('wTare').value),wd=num($('wWeightDisc').value),net=Math.max(0,gross-tare-wd),price=num($('wPrice').value),br=+(net*price).toFixed(2),md=num($('wMoneyDisc').value),ad=num($('wAdvanceValue').value),advanceId=$('wAdvance').value||null;if(wd>gross-tare){alert('O desconto em kg não pode ser maior que o peso após a tara.');return}if(md+ad>br){alert('Os descontos não podem ultrapassar o valor bruto.');return}if(ad>0&&!advanceId){alert('Selecione o adiantamento que será abatido.');return}const payload={data:$('wDate').value,tipo:$('wType').value,pessoa_id:$('wPerson').value,material_id:$('wMaterial').value||null,descricao_material:$('wDesc').value||null,peso_entrada:gross,tara,desconto_peso:wd,peso_liquido:net,preco_kg:price,valor_bruto:br,desconto_pesagem:md,desconto_adiantamento:ad,valor_liquido:+(br-md-ad).toFixed(2),observacoes:$('wNotes').value};const {data,error}=await db.from('financeiro_pesagens').insert(payload).select().single();if(error){alert(error.message);return}if(ad>0){const {error:de}=await db.from('financeiro_abatimentos_adiantamento').insert({adiantamento_id:advanceId,pesagem_id:data.id,valor:ad});if(de){await db.from('financeiro_pesagens').delete().eq('id',data.id);alert('Não foi possível abater o adiantamento: '+de.message);return}}alert('Pesagem salva! Ticket #'+data.numero_ticket);await loadAll()}
async function saveAdvance(ev){ev.preventDefault();const val=num($('aValue').value);const {error}=await db.from('financeiro_adiantamentos').insert({pessoa_id:$('aPerson').value,data:$('aDate').value,valor:val,saldo:val,observacoes:$('aNotes').value});if(error)alert(error.message);else{alert('Adiantamento registrado.');loadAll()}}
async function savePerson(ev){ev.preventDefault();const {error}=await db.from('financeiro_pessoas').insert({nome:$('pName').value,tipo:$('pType').value,documento:$('pDoc').value,telefone:$('pPhone').value,observacoes:$('pNotes').value});if(error)alert(error.message);else{alert('Pessoa cadastrada.');loadAll()}}
async function saveMaterial(ev){ev.preventDefault();const {error}=await db.from('financeiro_materiais').insert({nome:$('mName').value,preco_compra:num($('mBuy').value),preco_venda:num($('mSell').value)});if(error)alert(error.message);else{alert('Material cadastrado.');loadAll()}}
async function saveClose(ev){ev.preventDefault();const start=$('cStart').value,end=$('cEnd').value;if(end<start){alert('A data final deve ser igual ou posterior à inicial.');return}const rows=weighings.filter(w=>w.data>=start&&w.data<=end&&!w.fechamento_id),buy=rows.filter(x=>x.tipo==='compra'),sell=rows.filter(x=>x.tipo==='venda'),sum=(arr,key)=>arr.reduce((s,x)=>s+num(x[key]),0),adv=advances.filter(a=>a.data>=start&&a.data<=end);const purchases=sum(buy,'valor_liquido'),sales=sum(sell,'valor_liquido'),discounts=sum(rows,'desconto_pesagem'),adDiscount=sum(rows,'desconto_adiantamento'),advIssued=sum(adv,'valor'),toPay=purchases,toReceive=sales,balance=sales-purchases-advIssued;const {data,error}=await db.from('financeiro_fechamentos').insert({data_inicio:start,data_fim:end,compras:purchases,vendas:sales,descontos_pesagem:discounts,descontos_adiantamento:adDiscount,adiantamentos_liberados:advIssued,total_pagar:toPay,total_receber:toReceive,saldo_periodo:balance,observacoes:$('cNotes').value}).select().single();if(error){alert(error.message);return}if(rows.length){const ids=rows.map(x=>x.id);const {error:up}=await db.from('financeiro_pesagens').update({fechamento_id:data.id}).in('id',ids);if(up){alert('Fechamento salvo, mas não foi possível vincular todas as pesagens: '+up.message);return}}if(adv.length){const {error:ua}=await db.from('financeiro_adiantamentos').update({fechamento_id:data.id}).in('id',adv.map(x=>x.id));if(ua){alert('Fechamento salvo, mas não foi possível vincular os adiantamentos: '+ua.message);return}}alert('Fechamento salvo com '+rows.length+' pesagens e '+adv.length+' adiantamentos.');loadAll()}
async function saveConfig(ev){ev.preventDefault();const name=$('companyName').value.trim();const {error}=await db.from('financeiro_config').upsert({id:true,nome_empresa:name});if(error)alert(error.message);else{alert('Configuração salva.');$('companySide').textContent=name}}
</script></body></html>
